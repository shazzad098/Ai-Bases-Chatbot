# Local dev: `docker compose up -d` (postgres + redis). Without docker, set USE_SQLITE=1.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: nichedesk
      POSTGRES_PASSWORD: nichedesk
      POSTGRES_DB: nichedesk
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # Prod-style API service (uncomment when backend Dockerfile exists):
  # api:
  #   build: ./backend
  #   env_file: .env
  #   ports: ["8000:8000"]
  #   depends_on: [postgres, redis]

  # Async worker for ingestion/analytics jobs:
  # worker:
  #   build: ./backend
  #   command: celery -A app.queue worker --loglevel=info
  #   env_file: .env
  #   depends_on: [redis, postgres]

volumes:
  pgdata:
